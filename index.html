<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ドラムレッスン">
<meta name="theme-color" content="#f4f0e6">
<title>ドラムレッスン管理</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #f4f0e6;
    --surface: #ffffff;
    --surface2: #ede8dc;
    --border: #d5ccbb;
    --accent: #4a6e38;
    --accent2: #b85e22;
    --text: #28200e;
    --text2: #5c5040;
    --text3: #8a7c6a;
    --green: #3d6e32;
    --yellow: #96720a;
    --red: #b03020;
    --radius: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }

  /* Header */
  .header {
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 100;
  }
  .header-title {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .header-date {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--text3);
  }

  /* Layout */
  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 24px;
  }

  /* Section */
  .section {
    margin-bottom: 32px;
  }
  .section-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 12px;
  }

  /* Class info */
  .class-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 24px;
  }

  /* Input */
  input, textarea, select {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 16px;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus, textarea:focus, select:focus {
    border-color: var(--accent);
  }
  input::placeholder, textarea::placeholder {
    color: #666;
  }
  select option { background: var(--surface2); }

  /* Student cards */
  .students-grid {
    display: grid;
    gap: 12px;
  }

  .student-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color 0.15s;
  }
  .student-card:focus-within {
    border-color: #3e3e3e;
  }

  .student-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
    background: var(--surface2);
    min-height: 56px;
  }
  .student-num {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--text3);
    width: 20px;
    flex-shrink: 0;
  }
  .student-name-input {
    flex: 1;
    background: transparent;
    border: none;
    font-size: 15px;
    font-weight: 700;
    padding: 0;
    color: var(--text);
    min-width: 0;
  }
  .student-name-input:focus { border: none; box-shadow: none; }

  .student-phase {
    width: 110px;
    flex-shrink: 0;
    background: var(--surface);
    font-size: 13px;
    padding: 8px;
  }

  .toggle-btn {
    background: none;
    border: none;
    color: var(--text3);
    cursor: pointer;
    font-size: 22px;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s;
    flex-shrink: 0;
  }
  .toggle-btn:hover { color: var(--text); }

  .student-body {
    padding: 16px;
    display: none;
    border-top: 1px solid var(--border);
  }
  .student-body.open { display: block; }

  .fields-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }
  @media (max-width: 600px) {
    .fields-grid {
      grid-template-columns: 1fr;
    }
  }

  .field-group { display: flex; flex-direction: column; gap: 6px; }
  .field-label {
    font-size: 12px;
    color: var(--text2);
    font-weight: 500;
  }

  /* Slider */
  .slider-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .slider-wrap input[type=range] {
    flex: 1;
    padding: 0;
    height: 6px;
    border: none;
    accent-color: var(--accent);
    background: var(--border);
    cursor: pointer;
  }
  .slider-val {
    font-family: 'Space Mono', monospace;
    font-size: 16px;
    color: var(--accent);
    width: 20px;
    text-align: right;
    flex-shrink: 0;
  }

  /* API Key */
  .apikey-row {
    display: flex;
    gap: 10px;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
    margin-bottom: 24px;
  }
  .apikey-row label {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--text3);
    white-space: nowrap;
    letter-spacing: 0.05em;
  }
  .apikey-row input {
    flex: 1;
    background: transparent;
    border: none;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    padding: 0;
  }

  /* Run button */
  .run-btn:hover { opacity: 0.9; }
  .run-btn:active { transform: scale(0.99); }
  .run-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Output */

  /* Score card */



  /* Common bar */

  /* Student result cards */
  .result-cards { display: grid; gap: 10px; margin-bottom: 16px; }



  /* Action box */

  /* Loading */
  .loading-dots {
    font-family: 'Space Mono', monospace;
    font-size: 24px;
    letter-spacing: 0.3em;
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:1} }
  .loading-text { margin-top: 12px; font-size: 12px; color: var(--text3); }

  /* Error */
  .error-msg {
    display: none;
    background: rgba(248,113,113,0.1);
    border: 1px solid rgba(248,113,113,0.3);
    border-radius: var(--radius);
    padding: 12px 16px;
    color: var(--red);
    font-size: 13px;
    margin-top: 12px;
  }
  .error-msg.visible { display: block; }

  /* Divider */
  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 24px 0;
  }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0;
  }
  .tab-btn {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text3);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 8px 16px;
    cursor: pointer;
    transition: all 0.15s;
    margin-bottom: -1px;
  }
  .tab-btn:hover { color: var(--text2); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* Review cards */
  .review-class-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 12px;
    overflow: hidden;
  }
  .review-class-header {
    background: var(--surface2);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
  }
  .review-class-title {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 0.05em;
  }
  .review-class-meta {
    font-size: 11px;
    color: var(--text3);
  }
  .review-class-body {
    display: none;
    padding: 12px;
  }
  .review-class-body.open { display: block; }
  .review-student-row {
    background: var(--surface2);
    border-radius: 6px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .review-student-name {
    font-weight: 700;
    font-size: 13px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .review-fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .review-field { display: flex; flex-direction: column; gap: 2px; }
  .review-field-label {
    font-size: 10px;
    color: var(--text3);
    font-family: 'Space Mono', monospace;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .review-field-val {
    font-size: 12px;
    color: var(--text);
    line-height: 1.5;
  }
  .review-field-full {
    grid-column: 1 / -1;
  }
  .burden-pill {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--surface);
  }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open {
    display: flex;
  }
  .modal-sheet {
    background: var(--surface);
    border-radius: 16px 16px 0 0;
    width: 100%;
    max-width: 640px;
    max-height: 80vh;
    overflow-y: auto;
    padding: 20px;
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .modal-name {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
  }
  .modal-close {
    background: none;
    border: none;
    font-size: 22px;
    color: var(--text3);
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
  }
  .modal-row {
    margin-bottom: 12px;
  }
  .modal-row-label {
    font-size: 10px;
    color: var(--text3);
    font-family: 'Space Mono', monospace;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  .modal-row-val {
    font-size: 14px;
    color: var(--text);
    line-height: 1.6;
  }

  /* Class buttons */
  .class-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text2);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px;
    padding: 12px 8px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
    width: 100%;
  }
  .class-btn:hover { border-color: var(--accent); color: var(--text); }
  .class-btn.selected {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 700;
  }

  /* Day buttons */
  .day-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text2);
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    padding: 8px 24px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.05em;
  }
  .day-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 700;
  }

  /* Table view */
  .prep-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    margin-bottom: 20px;
  }
  .prep-table th {
    background: var(--surface2);
    color: var(--text3);
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 8px 10px;
    text-align: left;
    border-bottom: 2px solid var(--border);
    white-space: nowrap;
  }
  .prep-table td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    line-height: 1.5;
  }
  .prep-table tr:hover td { background: var(--surface2); }
  .prep-table tr.absent-row td { opacity: 0.4; }
  .prep-table .class-header-row td {
    background: var(--surface2);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    font-weight: 700;
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
  }

  /* Task cards */
  .task-class-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 12px;
    overflow: hidden;
  }
  .task-class-header {
    background: var(--surface2);
    padding: 10px 14px;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border);
  }
  .task-student-row {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    display: grid;
    gap: 4px;
  }
  .task-student-row:last-child { border-bottom: none; }
  .task-student-name {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .task-next {
    font-size: 12px;
    color: var(--text2);
    line-height: 1.5;
  }
  .task-song {
    font-size: 11px;
    color: var(--text3);
  }

  /* Override */
  .override-radio label {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
  }
  .override-radio input[type=radio] {
    width: auto;
    border: none;
    padding: 0;
    accent-color: var(--accent);
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<!-- 初期ロードオーバーレイ -->
<div id="init-overlay" style="
  position:fixed;inset:0;z-index:9999;
  background:var(--bg);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:20px;transition:opacity 0.4s ease;
">
  <div style="font-family:'Space Mono',monospace;font-size:22px;font-weight:700;color:var(--accent);letter-spacing:0.1em;">DRUM LESSON</div>
  <div style="width:240px;">
    <div style="height:4px;background:var(--border);border-radius:4px;overflow:hidden;">
      <div id="init-bar" style="height:100%;width:0%;background:var(--accent);border-radius:4px;transition:width 0.4s ease;"></div>
    </div>
    <div id="init-label" style="margin-top:10px;font-size:12px;color:var(--text3);font-family:'Space Mono',monospace;text-align:center;">データを読み込んでいます...</div>
  </div>
</div>

<!-- 保存完了画面 -->
<div id="save-overlay" style="
  position:fixed;inset:0;z-index:9998;
  background:var(--bg);
  display:none;flex-direction:column;
  align-items:center;justify-content:center;
  gap:24px;
">
  <div id="save-overlay-icon" style="font-size:64px;line-height:1;">✓</div>
  <div id="save-overlay-title" style="font-size:22px;font-weight:700;color:var(--accent);font-family:'Space Mono',monospace;">保存しました</div>
  <div id="save-overlay-names" style="font-size:14px;color:var(--text2);text-align:center;line-height:1.9;max-width:280px;"></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:8px;">
    <button onclick="closeSaveOverlay()" style="
      background:var(--accent);color:#fff;border:none;
      padding:14px 40px;border-radius:8px;font-size:15px;
      font-family:'Noto Sans JP',sans-serif;font-weight:700;
      cursor:pointer;letter-spacing:0.05em;
    ">次のクラスを入力</button>
    <button onclick="closeSaveOverlay(true)" style="
      background:none;color:var(--text3);border:1px solid var(--border);
      padding:10px 32px;border-radius:8px;font-size:13px;
      font-family:'Noto Sans JP',sans-serif;cursor:pointer;
    ">今週の準備タブへ</button>
  </div>
</div>

<div class="header">
  <span class="header-title">Drum Lesson</span>
  <span class="header-date" id="today-date"></span>
</div>

<div class="container">

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('input')">入力</button>
    <button class="tab-btn" onclick="switchTab('tasks')">今週の準備</button>
  </div>

  <!-- Tab: Input -->
  <div class="tab-content active" id="tab-input">

  <!-- Class info -->
  <div class="section">
    <div class="section-label">クラス情報</div>
    <div style="display:flex;gap:8px;margin-bottom:12px;align-items:center;">
      <button class="day-btn active" id="input-day-fri" onclick="filterInputDay('金曜')">金曜</button>
      <button class="day-btn" id="input-day-sat" onclick="filterInputDay('土曜')">土曜</button>
      <input type="date" id="lesson-date" style="flex:1;margin-left:8px;" onchange="autoSelectDay(this.value)">
    </div>
    <div id="class-btn-grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px;"></div>
    <select id="class-select" onchange="loadPreset(this)" style="display:none;">
      <option value="">── クラスを選択 ──</option>
    </select>
    <div id="selected-class-display" style="display:none;font-family:'Space Mono',monospace;font-size:12px;color:var(--accent);padding:6px 0;"></div>
  </div>

  <!-- Students -->
  <div class="section">
    <div class="section-label">生徒データ</div>
    <div class="students-grid" id="students-grid"></div>
  </div>

  <!-- Run -->
  <button class="run-btn" id="save-btn" onclick="saveDirectly()" style="margin-top:8px;">
    ✓ スプレッドシートに保存
  </button>
  <div class="error-msg" id="error-msg"></div>
  <div id="save-status" style="display:none;margin-top:10px;font-size:12px;font-family:'Space Mono',monospace;text-align:center;"></div>

</div><!-- /tab-input -->

  <!-- Tab: Tasks -->
  <div class="tab-content" id="tab-tasks">
    <div style="display:flex;gap:8px;margin-bottom:16px;">
      <button class="day-btn active" id="day-fri" onclick="switchDay('fri')">金曜</button>
      <button class="day-btn" id="day-sat" onclick="switchDay('sat')">土曜</button>
    </div>
    <div id="tasks-loading" style="display:none;text-align:center;padding:32px;color:var(--text3);font-size:13px;">読み込み中...</div>
    <div id="tasks-content"></div>
  </div><!-- /tab-tasks -->

</div><!-- /container -->

<!-- Student detail modal -->
<div class="modal-overlay" id="student-modal" onclick="closeModal(event)">
  <div class="modal-sheet">
    <div class="modal-header">
      <span class="modal-name" id="modal-name"></span>
      <button class="modal-close" onclick="closeStudentModal()">×</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
let CLASS_PRESETS = {};
let TRANSFER_DATA = []; // 振替予定データ
let LAST_SONGS = {}; // 各生徒の前回曲名
let CONCERT_DATA = []; // 発表会進捗データ
let HW_CHECKS = []; // 課題チェック状態

function setInitProgress(pct, label) {
  const bar = document.getElementById('init-bar');
  const lbl = document.getElementById('init-label');
  if (bar) bar.style.width = pct + '%';
  if (lbl) lbl.textContent = label;
}

function hideInitOverlay() {
  const ov = document.getElementById('init-overlay');
  if (!ov) return;
  ov.style.opacity = '0';
  setTimeout(() => ov.style.display = 'none', 400);
}

async function loadMasterData() {
  setInitProgress(5, 'データを読み込んでいます...');

  // キャッシュから即時表示し、先にオーバーレイを消す
  let hasCache = false;
  try {
    const cached = localStorage.getItem('drumMasterCache');
    if (cached) {
      const parsed = JSON.parse(cached);
      if (parsed.classes) { CLASS_PRESETS = parsed.classes; populateClassSelectors(); }
      if (parsed.transfers) TRANSFER_DATA = parsed.transfers;
      if (parsed.songs) LAST_SONGS = parsed.songs;
      hasCache = true;
      setInitProgress(100, '完了');
      hideInitOverlay();
    }
  } catch(e) {}

  // キャッシュなし時はプログレスを見せながら順次取得
  try {
    if (!hasCache) setInitProgress(10, '生徒マスターを読み込み中...');
    await loadClassMaster();

    if (!hasCache) setInitProgress(50, '振替データを読み込み中...');
    await loadTransferData();

    if (!hasCache) setInitProgress(80, '曲履歴を読み込み中...');
    await loadLastSongs();

    localStorage.setItem('drumMasterCache', JSON.stringify({
      classes: CLASS_PRESETS,
      transfers: TRANSFER_DATA,
      songs: LAST_SONGS,
      updated: Date.now()
    }));
  } finally {
    // キャッシュなし・エラー・タイムアウト いずれでも必ず抜ける
    if (!hasCache) {
      setInitProgress(100, '完了！');
      hideInitOverlay();
    }
  }
}

let currentInputDay = localStorage.getItem('drumLastDay') || '金曜';

function autoSelectDay(dateStr) {
  if (!dateStr) return;
  const dow = new Date(dateStr).getDay(); // 0=日,1=月...5=金,6=土
  // 日付変更時は曜日ボタンだけ切り替え（生徒リストは維持）
  if (dow === 5) filterInputDay('金曜', false);
  else if (dow === 6) filterInputDay('土曜', false);
}

function filterInputDay(day, autoLoad = true) {
  currentInputDay = day;
  localStorage.setItem('drumLastDay', day);
  document.getElementById('input-day-fri').classList.toggle('active', day === '金曜');
  document.getElementById('input-day-sat').classList.toggle('active', day === '土曜');
  renderClassButtons(day, autoLoad);
}

function renderClassButtons(day, autoLoad = true) {
  const grid = document.getElementById('class-btn-grid');
  const classes = Object.keys(CLASS_PRESETS)
    .filter(c => c.startsWith(day))
    .sort();

  const lastClass = localStorage.getItem('drumLastClass');

  grid.innerHTML = classes.map(c => {
    const isSelected = c === lastClass;
    return `<button class="class-btn ${isSelected ? 'selected' : ''}"
      onclick="selectClassBtn('${c}')">${c.replace(day, '').trim()}</button>`;
  }).join('');

  // 前回選択クラスを自動ロード（初回起動時のみ）
  if (autoLoad && lastClass && classes.includes(lastClass)) {
    const fakeSelect = { value: lastClass };
    loadPreset(fakeSelect);
    showSelectedClass(lastClass);
  }
}

function selectClassBtn(className) {
  localStorage.setItem('drumLastClass', className);
  // ボタンのスタイル更新
  document.querySelectorAll('.class-btn').forEach(btn => {
    btn.classList.toggle('selected', btn.textContent.trim() === className.replace(currentInputDay, '').trim());
  });
  // hidden selectを更新してloadPreset呼び出し
  const sel = document.getElementById('class-select');
  sel.value = className;
  loadPreset(sel);
  showSelectedClass(className);
}

function showSelectedClass(className) {
  const display = document.getElementById('selected-class-display');
  display.textContent = '選択中：' + className;
  display.style.display = 'block';
}

async function saveHwCheck(className, name, checked) {
  try {
    const form = new FormData();
    form.append('payload', JSON.stringify({action: 'hw_check', className, name, checked}));
    await fetch(GAS_URL, {method: 'POST', mode: 'no-cors', body: form});
    // ローカルも更新
    if (checked) {
      if (!HW_CHECKS.find(c => c.className === className && c.name === name)) {
        HW_CHECKS.push({className, name, checkedAt: new Date().toLocaleString('ja-JP')});
      }
    } else {
      HW_CHECKS = HW_CHECKS.filter(c => !(c.className === className && c.name === name));
    }
  } catch(e) {
    console.error('課題チェック保存エラー:', e);
  }
}

function resetStudentSlots() {
  for (let i = 1; i <= STUDENT_COUNT; i++) {
    document.getElementById(`s${i}_name`).value = '';
    document.getElementById(`s${i}_phase`).value = 'Pre';
    const memo = document.getElementById(`s${i}_memo`);
    if (memo) memo.value = '';
    const next = document.getElementById(`s${i}_next`);
    if (next) next.value = '';
    const cSong = document.getElementById(`s${i}_concert_song`);
    const cSheet = document.getElementById(`s${i}_concert_sheet`);
    const cReading = document.getElementById(`s${i}_concert_reading`);
    if (cSong) cSong.value = '';
    if (cSheet) cSheet.value = '';
    if (cReading) cReading.value = '';
    const cSec = document.getElementById(`s${i}_concert_section`);
    if (cSec) cSec.style.display = 'none';
    setAbsent(i, false);
    const body = document.getElementById(`body-${i}`);
    const btn = document.getElementById(`toggle-${i}`);
    if (body) body.classList.remove('open');
    if (btn) btn.textContent = '＋';
  }
}

function resetStudents() {
  // クラスを再読み込みしてリセット
  const sel = document.getElementById('class-select');
  if (sel && sel.value) loadPreset(sel);
  else resetStudentSlots();
}

function loadPreset(selectEl) {
  const key = selectEl.value;
  if (!key) return;
  const students = CLASS_PRESETS[key];
  if (!students) return;
  // class name is driven by select

  // 全生徒スロットをリセット（全入力欄をクリア）
  resetStudentSlots();

  // 今日の日付
  const todayStr = document.getElementById('lesson-date').value;

  // 体験生徒は当日のみ表示、通常生徒は常に表示（休みフラグは入力画面では無視）
  const visibleStudents = students.filter(s => {
    if (s.phase !== '体験') return true;
    if (!s.lessonDate) return false;
    return s.lessonDate === todayStr;
  });

  // 振替生徒：当日・当クラスのみ追加
  const transferStudents = TRANSFER_DATA.filter(t =>
    t.date === todayStr && t.className === key
  ).map(t => ({
    name: t.name + '（振替）',
    phase: 'Ph.2' // デフォルト。入力後に変更可
  }));

  const allStudents = [...visibleStudents, ...transferStudents];

  allStudents.forEach((s, i) => {
    if (i >= STUDENT_COUNT) return;
    const idx = i + 1;
    document.getElementById(`s${idx}_name`).value = s.name;
    document.getElementById(`s${idx}_phase`).value = s.phase;

    // 発表会参加生徒は発表会セクションを表示・前回データを入力
    if (s.concert) {
      const sec = document.getElementById(`s${idx}_concert_section`);
      if (sec) sec.style.display = 'flex';
      const cd = CONCERT_DATA.find(d => d.className === key && d.name === s.name);
      if (cd) {
        document.getElementById(`s${idx}_concert_song`).value    = cd.song          || '';
        document.getElementById(`s${idx}_concert_sheet`).value   = cd.sheetStatus   || '';
        document.getElementById(`s${idx}_concert_reading`).value = cd.readingStatus || '';
      }
    }
  });
}

function collectData() {
  const className = document.getElementById('class-select').value || '未設定クラス';
  const lessonDate = document.getElementById('lesson-date').value;

  const students = [];
  for (let i = 1; i <= STUDENT_COUNT; i++) {
    const name = document.getElementById(`s${i}_name`).value.trim();
    if (!name) continue;
    students.push({
      name,
      phase: document.getElementById(`s${i}_phase`).value,
      skill: 'なし',     // AI接続時にスキルマスターから参照
      song: 'なし',      // AI接続時に「今回やったこと」から自動判別
      songSection: 'なし',
      songWeeks: 'なし',
      memo: document.getElementById(`s${i}_memo`).value || 'なし',
      nextLesson: document.getElementById(`s${i}_next`).value || 'なし',
      concertSong:          (document.getElementById(`s${i}_concert_song`)?.value    || ''),
      concertSheetStatus:   (document.getElementById(`s${i}_concert_sheet`)?.value   || ''),
      concertReadingStatus: (document.getElementById(`s${i}_concert_reading`)?.value || ''),
    });
  }
  return { className, lessonDate, students };
}




async function saveDirectly() {
  const data = collectData();
  if (!data) return;

  const hasStudents = data.students.some(s => s.name && s.name !== 'なし');
  if (!hasStudents) {
    showError('生徒名が入力されていません');
    return;
  }

  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  btn.textContent = '保存中...';

  try {
    await saveToSheet(data);
    // 保存完了オーバーレイを表示
    const names = data.students.filter(s => s.name && s.name !== 'なし').map(s => s.name);
    showSaveOverlay(names);
  } finally {
    btn.textContent = '✓ スプレッドシートに保存';
    btn.disabled = false;
  }
}


function clearTaskCache(className) {
  try {
    localStorage.removeItem('drumTaskCache_' + className);
  } catch(e) {}
}

async function saveToSheet(data) {
  try {
    const payload = JSON.stringify(data);
    // GASはno-corsだとリダイレクトを追えないためフォーム送信方式で回避
    const form = new FormData();
    form.append('payload', payload);
    await fetch(GAS_URL, {
      method: 'POST',
      mode: 'no-cors',
      body: form
    });
    clearTaskCache(data.className);
  } catch(e) {
    showSaveStatus('保存に失敗しました: ' + e.message, true);
    throw e;  // saveDirectlyのfinallyに制御を返す
  }
}

function showSaveStatus(msg, isError = false) {
  if (isError) {
    // エラーはオーバーレイを出さずにalertで即通知
    const el = document.getElementById('save-status');
    el.textContent = msg;
    el.style.color = 'var(--red)';
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 5000);
    return;
  }
  // 成功は保存完了オーバーレイを表示
  const ov = document.getElementById('save-overlay');
  ov.style.display = 'flex';
}

function showSaveOverlay(studentNames) {
  const ov = document.getElementById('save-overlay');
  const namesEl = document.getElementById('save-overlay-names');
  namesEl.textContent = studentNames.join('　');
  ov.style.display = 'flex';
}

function closeSaveOverlay(goToTasks = false) {
  document.getElementById('save-overlay').style.display = 'none';
  if (goToTasks) {
    switchTab('tasks');
  }
  // フォームを次の入力用にリセット（クラス選択・日付は保持）
  resetStudents();
}

function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach((btn, i) => {
    const tabName = ['input','tasks'][i];
    btn.classList.toggle('active', tabName === name);
  });
  document.querySelectorAll('.tab-content').forEach(el => {

async function loadReview() {
  const className = document.getElementById('review-class-select').value;
  if (!className) { alert('クラスを選択してください'); return; }

  document.getElementById('review-loading').style.display = 'block';
  document.getElementById('review-content').innerHTML = '';

  try {
    // POSTでreadアクションを送信（CORSを回避するためFormData使用）
    const form = new FormData();
    form.append('payload', JSON.stringify({ action: 'read', className: className }));

    await fetch(GAS_URL, {
      method: 'POST',
      mode: 'no-cors',
      body: form
    });

    // no-corsでは返答が読めないため、少し待ってからスプレッドシートAPIで取得
    // 代替：Claude APIを使ってスプシのデータを取得する
    await loadReviewViaClaudeAPI(className);

  } catch(e) {
    document.getElementById('review-content').innerHTML =
      '<div style="color:var(--red);font-size:13px;padding:16px;">読み込みエラー：' + e.message + '</div>';
    document.getElementById('review-loading').style.display = 'none';
  }
}

async function loadReviewViaClaudeAPI(className) {
  // GASのread用エンドポイントをClaude API経由で呼ぶのではなく
  // スプレッドシートのデータをGASから直接JSONPで取得する方式に変更
  // scriptタグを使ったJSONP方式でCORSを回避
  const callbackName = 'gasCallback_' + Date.now();

  return new Promise((resolve, reject) => {
    const timeout = setTimeout(() => {
      cleanup();
      document.getElementById('review-loading').style.display = 'none';
      document.getElementById('review-content').innerHTML =
        '<div style="color:var(--red);font-size:13px;padding:16px;">タイムアウトしました。もう一度試してください。</div>';
      reject(new Error('timeout'));
    }, 15000);

    window[callbackName] = function(data) {
      cleanup();
      if (data.status === 'error') {
        document.getElementById('review-content').innerHTML =
          '<div style="color:var(--red);font-size:13px;padding:16px;">エラー：' + data.message + '</div>';
      } else {
        renderReview(data.data, className);
      }
      document.getElementById('review-loading').style.display = 'none';
      resolve();
    };

    function cleanup() {
      clearTimeout(timeout);
      delete window[callbackName];
      const s = document.getElementById('jsonp-script');
      if (s) s.remove();
    }

    const script = document.createElement('script');
    script.id = 'jsonp-script';
    script.src = GAS_URL + '?action=read&class=' + encodeURIComponent(className) + '&callback=' + callbackName;
    document.head.appendChild(script);
    script.onerror = () => {
      cleanup();
      document.getElementById('review-loading').style.display = 'none';
      document.getElementById('review-content').innerHTML =
        '<div style="color:var(--red);font-size:13px;padding:16px;">読み込みに失敗しました。</div>';
      reject(new Error('script error'));
    };
  });
}

  const classes = Object.keys(CLASS_PRESETS)
    .filter(c => c.startsWith(prefix))
    .sort();

  if (classes.length === 0) {
    document.getElementById('tasks-content').innerHTML =
      '<div style="color:var(--text3);font-size:13px;padding:16px;">クラスデータがありません</div>';
    return;
  }

  document.getElementById('tasks-loading').style.display = 'block';
  document.getElementById('tasks-content').innerHTML = '';

  // 全クラス分のデータを並列取得
  const results = await Promise.all(classes.map(className => fetchClassData(className)));

  document.getElementById('tasks-loading').style.display = 'none';

  let html = '';
  classes.forEach((className, i) => {
    const rows = results[i];

    // 体験・振替バッジ
    const badges = buildBadges(className);

    // 生徒ごとの最新データ
    const studentMap = {};
    if (rows && rows.length > 0) {
      rows.forEach(row => {

        if (!studentMap[name] || row['記録日時'] > studentMap[name]['記録日時']) {
          studentMap[name] = row;
        }
      });
    }

    // 行データをwindowに保存（モーダル用）
    if (!window._taskRows) window._taskRows = {};

      .filter(s => s.phase !== '体験')
      .map(s => {

            style="font-size:11px;padding:3px 10px;border-radius:4px;cursor:pointer;font-family:'Space Mono',monospace;
            background:${hwChecked ? 'var(--green)' : 'none'};
            color:${hwChecked ? '#fff' : 'var(--text3)'};
            border:1px solid ${hwChecked ? 'var(--green)' : 'var(--border)'};">
            ${hwChecked ? '✓ 済' : '準備する'}
          </button>`
        : `<span style="color:var(--text3);font-size:11px;">なし</span>`;

      const trialBadge  = s.phase === '体験'
        ? `<span style="font-size:10px;color:var(--accent2);border:1px solid var(--accent2);padding:1px 5px;border-radius:3px;margin-left:4px;">体験</span>`
        : '';

      const rowKey2 = className + '___' + s.name;
      if (!window._taskRows) window._taskRows = {};
      window._taskRows[rowKey2] = row;

      html += `<tr class="${s.absent ? 'absent-row' : ''}"
        style="cursor:pointer;"
        onclick="openStudentModal('${s.name}', window._taskRows['${rowKey2}'])">
        <td style="color:var(--accent);font-family:'Space Mono',monospace;font-size:10px;white-space:nowrap;">${className}</td>
        <td style="font-weight:700;white-space:nowrap;">${s.name}${trialBadge}${s.absent ? ' <span style="font-size:10px;color:var(--text3);">(休)</span>' : ''}</td>
        <td style="font-size:11px;white-space:nowrap;">${phase}</td>
        <td style="font-size:12px;max-width:200px;color:var(--text2);line-height:1.5;">${memo}</td>
        <td style="font-size:12px;max-width:180px;color:var(--accent);line-height:1.5;">${nextLesson}</td>
        <td onclick="event.stopPropagation();">${hwCell}</td>
      </tr>`;
    });
  });

  html += '</tbody></table>';
  return html;
}

function toggleHwCheck(key, btn) {
  // カードビュー用（localStorage）
  const checked = localStorage.getItem(key) === '1';
  const newVal = checked ? '0' : '1';
  localStorage.setItem(key, newVal);
  btn.style.background = newVal === '1' ? 'var(--green)' : 'none';
  btn.style.color = newVal === '1' ? '#fff' : 'var(--text3)';
  btn.style.border = `1px solid ${newVal === '1' ? 'var(--green)' : 'var(--border)'}`;
  btn.textContent = newVal === '1' ? '✓ 準備済み' : '課題準備';
}

async function toggleHwCheckGas(className, name, btn) {
  // テーブルビュー用（GAS連携）
  const checked = HW_CHECKS.some(c => c.className === className && c.name === name);
  const newChecked = !checked;
  // 即時UI更新
  btn.style.background = newChecked ? 'var(--green)' : 'none';
  btn.style.color = newChecked ? '#fff' : 'var(--text3)';
  btn.style.border = `1px solid ${newChecked ? 'var(--green)' : 'var(--border)'}`;
  btn.textContent = newChecked ? '✓ 済' : '準備する';
  // GASに保存
  await saveHwCheck(className, name, newChecked);
}

function buildBadges(className) {
  let html = '';

  // 振替バッジ
  const transfers = TRANSFER_DATA.filter(t => t.className === className);
  transfers.forEach(t => {
    const dateStr = t.date
      ? new Date(t.date).toLocaleDateString('ja-JP', {month:'long', day:'numeric', weekday:'short'})
      : '日程未定';
    html += `<div style="padding:8px 14px;background:rgba(74,110,56,0.08);border-bottom:1px solid var(--border);font-size:12px;color:var(--accent);">
      🔄 振替：${t.name}　${dateStr}　${t.originalClass ? t.originalClass + 'から' : ''}
    </div>`;
  });

  // 体験バッジ
  const trials = (CLASS_PRESETS[className] || []).filter(s => s.phase === '体験');
  trials.forEach(s => {
    const dateStr = s.lessonDate
      ? new Date(s.lessonDate).toLocaleDateString('ja-JP', {month:'long', day:'numeric', weekday:'short'})
      : '日程未定';
    html += `<div style="padding:8px 14px;background:rgba(184,94,34,0.08);border-bottom:1px solid var(--border);font-size:12px;color:var(--accent2);">
      🔔 体験：${s.name}　${dateStr}${s.note ? '　' + s.note : ''}　キッズプリント準備
    </div>`;
  });

  return html;
}

async function fetchClassData(className) {
  const WEEK_MS = 7 * 24 * 60 * 60 * 1000;
  const cacheKey = 'drumTaskCache_' + className;

  // キャッシュ確認（1週間以内なら即返す）
  try {
    const cached = localStorage.getItem(cacheKey);
    if (cached) {
      const parsed = JSON.parse(cached);
      if (Date.now() - parsed.ts < WEEK_MS) {
        // バックグラウンドで更新
        fetchClassDataFromGAS(className).then(rows => {
          if (rows.length > 0) {
            localStorage.setItem(cacheKey, JSON.stringify({data: rows, ts: Date.now()}));
          }
        });
        return parsed.data;
      }
    }
  } catch(e) {}

  // キャッシュなし → GASから取得
  const rows = await fetchClassDataFromGAS(className);
  if (rows.length > 0) {
    try {
      localStorage.setItem(cacheKey, JSON.stringify({data: rows, ts: Date.now()}));
    } catch(e) {}
  }
  return rows;
}

async function fetchClassDataFromGAS(className) {
  return new Promise((resolve) => {
    const callbackName = 'classCallback_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const scriptId = 'class-script-' + callbackName;
    const timeout = setTimeout(() => {
      delete window[callbackName];
      const s = document.getElementById(scriptId);
      if (s) s.remove();
      resolve([]);
    }, 10000);

    window[callbackName] = function(data) {
      clearTimeout(timeout);
      delete window[callbackName];
      const s = document.getElementById(scriptId);
      if (s) s.remove();
      resolve(data.status === 'ok' ? data.data : []);
    };

    const script = document.createElement('script');
    script.id = scriptId;
    script.src = GAS_URL + '?action=read&class=' + encodeURIComponent(className) + '&callback=' + callbackName;
    document.head.appendChild(script);
    script.onerror = () => { clearTimeout(timeout); resolve([]); };
  });
}

function toggleAbsent(i) {
  const btn = document.getElementById(`absent-btn-${i}`);
  const isAbsent = btn.dataset.absent === '1';
  setAbsent(i, !isAbsent);
}

function setAbsent(i, absent) {
  const btn = document.getElementById(`absent-btn-${i}`);
  if (!btn) return;
  btn.dataset.absent = absent ? '1' : '0';
  btn.style.background = absent ? 'var(--border)' : 'none';
  btn.style.color = absent ? 'var(--text2)' : 'var(--text3)';
  btn.textContent = absent ? '休み✓' : '休み';
  // 入力欄を無効化
  const body = document.getElementById(`body-${i}`);
  if (body) {
    body.querySelectorAll('input, select, textarea').forEach(el => {
      el.disabled = absent;
    });
    body.style.opacity = absent ? '0.4' : '1';
    body.style.pointerEvents = absent ? 'none' : '';
  }
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.classList.add('visible');
}

init();
</script>
